<script>
/* Вибір фонового відео за шириною екрана.
   Атрибут media на <source> у <video> ненадійний (Chrome та ін. його ігнорують),
   тому джерело задаємо через matchMedia — вантажиться лише потрібне одне,
   і перемикається при повороті екрана / ресайзі. */
(function () {
  var v = document.querySelector('.bg-video');
  if (!v) return;
  var mq = window.matchMedia('(max-width: 600px)');
  var current = '';
  function pick() {
    var src = mq.matches ? v.getAttribute('data-src-mobile') : v.getAttribute('data-src-desktop');
    if (src && src !== current) {
      current = src;
      v.src = src;
      v.load();
      var p = v.play();
      if (p && p.catch) p.catch(function () {});
    }
  }
  pick();
  if (mq.addEventListener) mq.addEventListener('change', pick);
  else if (mq.addListener) mq.addListener(pick);
})();
</script>

<script>
// Повне меню з алкоголем (внутрішня версія)
const HIDDEN_CATS = new Set([]);
const INJECT_SCHEMA = false;

const TAB_TO_CAT = {
  food: 'food',
  sushi: 'sushi',
  drinks: 'drinks',
  lemonades: 'lemon',
  teas: 'tea',
  bar: 'bar',
  cocktails: 'cocktails',
  hookah: 'hook'
};

const TAB_TITLES = {
  food: '🍽 Їжа',
  sushi: '🍣 Суші та роли',
  drinks: '☕ Напої',
  lemonades: '🍋 Лимонади',
  teas: '🫖 Чаї',
  bar: '🥃 Бар',
  cocktails: '🍹 Коктейлі',
  hookah: '💨 Кальян'
};

const GRID_PHOTO_CATS = new Set(['food', 'sushi']);
const LIST_CATS = new Set(['drinks']);
// Всі інші — текстова сітка (lemon, tea, hook)

const CACHE_KEY = 'sh_menu_cache_v2';
let ALL_ITEMS = [];
let activeTab = 'food';

/* ── Швидке завантаження: спершу кеш (миттєво), потім свіжі дані ── */

function isVisible(i) {
  return i.vis === true || i.vis === 'TRUE' || i.vis === 'true' || i.vis === 1 || i.vis === '1';
}

/* Фото в таблиці записані відносно (img/...) — підставляємо домен GitHub Pages,
   де вони фізично лежать, щоб сторінка працювала з будь-якого хостингу */
const PHOTO_BASE = 'https://smokyhouse.github.io/smoky/';
function absPhoto(p) {
  if (!p) return p;
  return /^https?:\/\//i.test(p) ? p : PHOTO_BASE + String(p).replace(/^\.?\//, '');
}

function prepare(items) {
  return items
    .filter(i => isVisible(i) && !HIDDEN_CATS.has(i.cat))
    .map((i, idx) => Object.assign({}, i, { order: Number(i.order) || (idx + 1), price: parseInt(i.price) || 0, photo: absPhoto(i.photo) }))
    .sort((a, b) => a.order - b.order);
}

function readCache() {
  try {
    const c = JSON.parse(localStorage.getItem(CACHE_KEY));
    if (c && Array.isArray(c.items) && c.items.length) return c.items;
  } catch (e) {}
  return null;
}

function writeCache(items) {
  try { localStorage.setItem(CACHE_KEY, JSON.stringify({ ts: Date.now(), items })); } catch (e) {}
}

async function loadMenu() {
  // 1. Кеш із минулого візиту → меню видно одразу, без спінера
  const cached = readCache();
  if (cached) {
    ALL_ITEMS = prepare(cached);
    renderAll();
  }

  // 2. Свіжі дані: опублікований JSON (стартував у <head>), інакше — Apps Script
  try {
    let d = await window.__menuPromise;
    if (!(d && d.items && d.items.length)) {
      d = await fetch(SCRIPT_URL + '?action=getItems').then(r => r.json());
    }
    if (d && d.items && d.items.length) {
      writeCache(d.items);
      const fresh = prepare(d.items);
      if (!cached || JSON.stringify(fresh) !== JSON.stringify(ALL_ITEMS)) {
        ALL_ITEMS = fresh;
        renderAll();
      }
      return;
    }
    if (!cached) await loadCSV();
  } catch (e) {
    if (!cached) await loadCSV();
  }
}

async function loadCSV() {
  try {
    const r = await fetch(`https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&sheet=Menu`);
    const t = await r.text();
    ALL_ITEMS = prepare(parseCSV(t));
    writeCache(ALL_ITEMS);
    renderAll();
  } catch(e) {
    document.getElementById('menu-container').innerHTML =
      '<div style="color:#f07070;text-align:center;padding:40px 20px;font-size:13px">⚠️ Не вдалося завантажити меню.<br><span style="color:#888;font-size:11px">Перевірте підключення до інтернету.</span></div>';
  }
}

function parseCSV(text) {
  const lines = text.trim().split('\n');
  if (lines.length < 2) return [];
  function parseLine(line) {
    const res = []; let inQ = false, cur = '';
    for (let i = 0; i < line.length; i++) {
      const ch = line[i];
      if (ch === '"') {
        if (inQ && line[i+1] === '"') { cur += '"'; i++; } else inQ = !inQ;
      } else if (ch === ',' && !inQ) { res.push(cur); cur = ''; }
      else cur += ch;
    }
    res.push(cur); return res;
  }
  const headers = parseLine(lines[0]);
  return lines.slice(1).map(line => {
    const vals = parseLine(line), obj = {};
    headers.forEach((h, i) => obj[h.trim()] = (vals[i] || '').trim());
    obj.vis = obj.vis !== 'FALSE' && obj.vis !== 'false' && obj.vis !== '0';
    obj.price = parseInt(obj.price) || 0;
    obj.order = parseInt(obj.order) || 0;
    return obj;
  }).filter(i => i.name);
}

function renderAll() {
  const container = document.getElementById('menu-container');
  container.innerHTML = '';

  Object.keys(TAB_TO_CAT).forEach(tab => {
    const cat = TAB_TO_CAT[tab];
    const items = ALL_ITEMS.filter(i => i.cat === cat);
    const sec = document.createElement('div');
    sec.id = 'tab-' + tab;
    sec.className = 'category-section' + (tab === activeTab ? ' active' : '');
    sec.innerHTML = buildCategory(tab, cat, items);
    container.appendChild(sec);
  });

  container.querySelectorAll('.menu-card-photo').forEach(card => {
    card.addEventListener('click', () => {
      openModal(card, card.dataset.name, card.dataset.weight, card.dataset.price, card.dataset.photo, card.dataset.desc);
    });
  });
  container.querySelectorAll('.menu-card').forEach(card => {
    if (card.dataset.desc || card.dataset.photo) {
      card.addEventListener('click', () => {
        openModal(card, card.dataset.name, card.dataset.weight, card.dataset.price, card.dataset.photo, card.dataset.desc);
      });
    }
  });
  injectMenuSchema();
}

/* ── Schema.org Menu (лише публічна версія): Google бачить позиції та ціни ── */
function injectMenuSchema() {
  if (!INJECT_SCHEMA || !ALL_ITEMS.length) return;
  const sections = [];
  Object.keys(TAB_TO_CAT).forEach(tab => {
    const cat = TAB_TO_CAT[tab];
    const its = ALL_ITEMS.filter(i => i.cat === cat);
    if (!its.length) return;
    sections.push({
      "@type": "MenuSection",
      "name": TAB_TITLES[tab].replace(/^\S+\s/, ''),
      "hasMenuItem": its.map(i => {
        const m = { "@type": "MenuItem", "name": i.name,
          "offers": { "@type": "Offer", "price": String(i.price), "priceCurrency": "UAH" } };
        if (i.desc) m.description = i.desc;
        return m;
      })
    });
  });
  const data = {
    "@context": "https://schema.org",
    "@type": "Menu",
    "name": "Меню Smoky House",
    "inLanguage": "uk",
    "hasMenuSection": sections
  };
  let el = document.getElementById('menu-jsonld');
  if (!el) {
    el = document.createElement('script');
    el.type = 'application/ld+json';
    el.id = 'menu-jsonld';
    document.head.appendChild(el);
  }
  el.textContent = JSON.stringify(data);
}

function buildCategory(tab, cat, items) {
  const title = TAB_TITLES[tab] || tab;
  if (!items.length) return `<div class="section-title">${title}</div><p style="color:#888;font-size:13px;padding:20px 0">Позиції відсутні</p>`;
  if (LIST_CATS.has(cat)) return buildListCategory(title, items);
  if (GRID_PHOTO_CATS.has(cat)) return buildPhotoGridCategory(title, items);
  return buildTextGridCategory(title, items);
}

function buildPhotoGridCategory(title, items) {
  const groups = {};
  items.forEach(i => { const s = i.subcat||''; if(!groups[s]) groups[s]=[]; groups[s].push(i); });
  let html = `<div class="section-title">${title}</div>`;
  Object.entries(groups).forEach(([sub, arr]) => {
    if (sub) html += `<div class="subsection-title">${sub}</div>`;
    html += '<div class="menu-grid">';
    arr.forEach(i => {
      const ph = i.photo
        ? `<img src="${esc(i.photo)}" alt="${esc(i.name)}" loading="lazy" decoding="async">`
        : `<div class="no-photo"><svg viewBox="0 0 24 24"><path d="M21 19V5c0-1.1-.9-2-2-2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2zM8.5 13.5l2.5 3.01L14.5 12l4.5 6H5l3.5-4.5z"/></svg></div>`;
      html += `<div class="menu-card-photo"
        data-name="${escA(i.name)}" data-weight="${escA(i.weight||'')}"
        data-price="${i.price}" data-photo="${escA(i.photo||'')}" data-desc="${escA(i.desc||'')}">
        <div class="photo-slot">${ph}</div>
        <div class="card-body">
          <div class="item-info">
            <div class="item-name">${esc(i.name)}</div>
            ${i.weight ? `<div class="item-weight">${esc(i.weight)}</div>` : ''}
          </div>
          <div class="item-price">${i.price} ₴</div>
        </div>
      </div>`;
    });
    html += '</div>';
  });
  return html;
}

function buildTextGridCategory(title, items) {
  const groups = {};
  items.forEach(i => { const s = i.subcat||''; if(!groups[s]) groups[s]=[]; groups[s].push(i); });
  let html = `<div class="section-title">${title}</div>`;
  Object.entries(groups).forEach(([sub, arr]) => {
    if (sub) html += `<div class="subsection-title">${sub}</div>`;
    html += '<div class="menu-grid">';
    arr.forEach(i => {
      const clickable = (i.desc || i.photo) ? 'style="cursor:pointer"' : '';
      html += `<div class="menu-card" ${clickable}
        data-name="${escA(i.name)}" data-weight="${escA(i.weight||'')}"
        data-price="${i.price}" data-photo="${escA(i.photo||'')}" data-desc="${escA(i.desc||'')}">
        <div class="item-info">
          <div class="item-name">${esc(i.name)}</div>
          ${i.desc ? `<div class="item-desc">${esc(i.desc)}</div>` : ''}
          ${i.weight ? `<div class="item-weight" style="font-size:11px;color:#888;margin-top:2px">${esc(i.weight)}</div>` : ''}
        </div>
        <div class="item-price">${i.price} ₴</div>
      </div>`;
    });
    html += '</div>';
  });
  return html;
}

function buildListCategory(title, items) {
  const groups = {};
  items.forEach(i => { const s = i.subcat||''; if(!groups[s]) groups[s]=[]; groups[s].push(i); });
  let html = `<div class="section-title">${title}</div>`;
  Object.entries(groups).forEach(([sub, arr]) => {
    if (sub) html += `<div class="subsection-title">${sub}</div>`;
    html += '<div class="menu-list">';
    arr.forEach(i => {
      html += `<div class="menu-item">
        <div class="item-info">
          <div class="item-name">${esc(i.name)}</div>
          ${i.desc ? `<div class="item-desc">${esc(i.desc)}</div>` : ''}
          ${i.weight ? `<div class="item-desc">${esc(i.weight)}</div>` : ''}
        </div>
        <div class="item-price">${i.price} ₴</div>
      </div>`;
    });
    html += '</div>';
  });
  return html;
}

function showTab(tabName, btn) {
  activeTab = tabName;
  document.querySelectorAll('.category-section').forEach(s => s.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  const sec = document.getElementById('tab-' + tabName);
  if (sec) sec.classList.add('active');
  if (btn) {
    btn.classList.add('active');
    // Центруємо активний таб у рядку (для мобільного скролу)
    const tabs = document.getElementById('tabsScroll');
    if (tabs && tabs.scrollWidth > tabs.clientWidth) {
      const left = btn.offsetLeft - (tabs.clientWidth - btn.clientWidth) / 2;
      tabs.scrollTo({ left: Math.max(0, left), behavior: 'smooth' });
    }
  }
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function openModal(card, name, weight, price, photo, desc) {
  const modal = document.getElementById('item-modal');
  const imgWrap = document.getElementById('modal-img-wrap');
  const modalImg = document.getElementById('modal-image');

  imgWrap.classList.remove('zoomed');
  modalImg.style.transform = 'scale(1)';

  let imgSrc = photo || (card && card.querySelector('img') ? card.querySelector('img').src : '');
  if (imgSrc) {
    modalImg.src = imgSrc;
    imgWrap.style.display = 'flex';
  } else {
    imgWrap.style.display = 'none';
  }

  modal.querySelector('.modal-name').textContent = name;
  modal.querySelector('.modal-weight').textContent = weight || '';
  modal.querySelector('.modal-price').textContent = price + ' ₴';
  modal.querySelector('.modal-desc').innerHTML = desc || (card && card.dataset.desc) || '';
  modal.classList.add('open');
  document.body.style.overflow = 'hidden';
}

function closeModal() {
  document.getElementById('item-modal').classList.remove('open');
  document.body.style.overflow = '';
}
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

function esc(s)  { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function escA(s) { return String(s||'').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }

loadMenu();
</script>

<script>
/* ── Tabs-nav arrow: показується тільки коли є горизонтальний скрол ── */
(function() {
  const tabs = document.getElementById('tabsScroll');
  const nav  = document.getElementById('tabs-nav-arrow');
  if (!tabs || !nav) return;

  function update() {
    const overflowing = tabs.scrollWidth > tabs.clientWidth + 4;
    if (!overflowing) {
      nav.style.opacity = '0';
      nav.style.pointerEvents = 'none';
      return;
    }
    const atEnd = tabs.scrollLeft + tabs.clientWidth >= tabs.scrollWidth - 10;
    nav.style.opacity = atEnd ? '0' : '1';
  }

  tabs.addEventListener('scroll', update, { passive: true });
  window.addEventListener('resize', update, { passive: true });
  window.addEventListener('load', update);
  update();
  setTimeout(update, 200);
})();

/* ── Smoke canvas ── */
(function() {
  const canvas = document.getElementById('smoke-canvas');
  if (!canvas) return;
  const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (reduceMotion) return;
  const ctx = canvas.getContext('2d');
  let W, H, particles = [];

  function resize() { W = canvas.width = window.innerWidth; H = canvas.height = window.innerHeight; }
  resize();
  window.addEventListener('resize', resize, { passive: true });

  class Particle {
    constructor(init) { this.reset(init); }
    reset(init) {
      this.x = W * 0.05 + Math.random() * W * 0.9;
      this.y = init ? H * (0.7 + Math.random() * 0.45) : H + 20 + Math.random() * 60;
      this.radius = 50 + Math.random() * 110;
      this.alpha = 0;
      this.targetAlpha = 0.045 + Math.random() * 0.085;
      this.vx = (Math.random() - 0.5) * 0.28;
      this.vy = -(0.28 + Math.random() * 0.42);
      this.life = 0;
      this.maxLife = 320 + Math.random() * 220;
      this.startPhase = Math.random() * Math.PI * 2;
      const warm = Math.random() < 0.25;
      this.r = warm ? 255 : 205 + Math.floor(Math.random() * 50);
      this.g = warm ? 218 : 205 + Math.floor(Math.random() * 50);
      this.b = warm ? 120 : 205 + Math.floor(Math.random() * 50);
    }
    update() {
      this.life++;
      const p = this.life / this.maxLife;
      if (p < 0.15)      this.alpha = (p / 0.15) * this.targetAlpha;
      else if (p > 0.65) this.alpha = ((1 - p) / 0.35) * this.targetAlpha;
      else               this.alpha = this.targetAlpha;
      this.x += this.vx + Math.sin(this.life * 0.016 + this.startPhase) * 0.3;
      this.y += this.vy;
      this.radius += 0.22;
      if (this.life >= this.maxLife) this.reset(false);
    }
    draw() {
      const g = ctx.createRadialGradient(this.x, this.y, 0, this.x, this.y, this.radius);
      g.addColorStop(0,   `rgba(${this.r},${this.g},${this.b},${this.alpha})`);
      g.addColorStop(0.4, `rgba(${this.r},${this.g},${this.b},${this.alpha * 0.55})`);
      g.addColorStop(1,   `rgba(${this.r},${this.g},${this.b},0)`);
      ctx.beginPath();
      ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
      ctx.fillStyle = g;
      ctx.fill();
    }
  }

  const isMobile = window.innerWidth < 600;
  const COUNT = isMobile ? 30 : 55; // менше частинок на мобільному = плавніше скрол
  for (let i = 0; i < COUNT; i++) {
    const p = new Particle(true);
    p.life = Math.floor(Math.random() * p.maxLife);
    particles.push(p);
  }

  let running = true;
  document.addEventListener('visibilitychange', () => {
    running = !document.hidden;
    if (running) animate();
  });

  function animate() {
    if (!running) return;
    ctx.clearRect(0, 0, W, H);
    particles.forEach(p => { p.update(); p.draw(); });
    requestAnimationFrame(animate);
  }
  animate();
})();

/* ── Zoom & Pan у модальному фото ── */
(function() {
  const wrap = document.getElementById('modal-img-wrap');
  const img  = document.getElementById('modal-image');
  if (!wrap || !img) return;

  let isZoomed = false, isDragging = false;
  let startX = 0, startY = 0, translateX = 0, translateY = 0, moved = false;
  const SCALE = 1.8, THRESHOLD = 6;

  wrap.style.touchAction = 'none';

  function limits() {
    const r = wrap.getBoundingClientRect();
    return { x: (r.width * (SCALE - 1)) / 2, y: (r.height * (SCALE - 1)) / 2 };
  }
  function clamp(v, a, b) { return Math.min(Math.max(v, a), b); }
  function applyTransform() {
    img.style.transform = isZoomed ? `scale(${SCALE}) translate(${translateX}px,${translateY}px)` : 'scale(1)';
  }
  function reset() {
    isZoomed = false; translateX = 0; translateY = 0;
    wrap.classList.remove('zoomed'); applyTransform();
  }

  wrap.addEventListener('click', e => {
    if (moved) { moved = false; return; }
    if (isZoomed) { reset(); }
    else { isZoomed = true; wrap.classList.add('zoomed'); applyTransform(); }
  });
  wrap.addEventListener('pointerdown', e => {
    if (!isZoomed) return;
    isDragging = true; startX = e.clientX; startY = e.clientY; moved = false;
    wrap.setPointerCapture(e.pointerId);
  });
  wrap.addEventListener('pointermove', e => {
    if (!isZoomed || !isDragging) return;
    const dx = e.clientX - startX, dy = e.clientY - startY;
    if (Math.abs(dx) > THRESHOLD || Math.abs(dy) > THRESHOLD) moved = true;
    startX = e.clientX; startY = e.clientY;
    const lim = limits();
    translateX = clamp(translateX + dx, -lim.x, lim.x);
    translateY = clamp(translateY + dy, -lim.y, lim.y);
    applyTransform(); e.preventDefault();
  });
  wrap.addEventListener('pointerup',     () => { isDragging = false; });
  wrap.addEventListener('pointercancel', () => { isDragging = false; });
})();
</script>
